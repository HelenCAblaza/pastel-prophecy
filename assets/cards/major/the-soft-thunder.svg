  <g>
    <circle cx="233" cy="250" r="3.83" fill="#fff" opacity=".72"/><circle cx="198" cy="298" r="3.94" fill="#fff" opacity=".72"/><circle cx="177" cy="221" r="4.29" fill="#fff" opacity=".72"/><circle cx="369" cy="511" r="3.45" fill="#fff" opacity=".72"/><circle cx="247" cy="375" r="2.63" fill="#fff" opacity=".72"/><circle cx="237" cy="347" r="2.96" fill="#fff" opacity=".72"/><circle cx="374" cy="236" r="3.24" fill="#fff" opacity=".72"/><circle cx="398" cy="278" r="4.13" fill="#fff" opacity=".72"/>
