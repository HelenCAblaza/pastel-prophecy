<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">The Moonlit Unicorn</title>
<desc id="desc">A white-background watercolor line-art unicorn oracle card with pastel hearts and stars.</desc>
<defs>
  <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="22" result="noise"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff5b8"/><stop offset=".4" stop-color="#d6a547"/><stop offset=".72" stop-color="#fff0a5"/><stop offset="1" stop-color="#a97928"/>
  </linearGradient>
  <style>
    .ink{fill:none;stroke:#615064;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
    .thin{fill:none;stroke:#615064;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
    .lash{fill:none;stroke:#29232f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.88}
    .wash{filter:url(#soft);opacity:.78}
    .heart{opacity:.78;stroke:#fff;stroke-width:1.6}
    .star{opacity:.75;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="720" height="1080" fill="#fffdf8" filter="url(#paper)"/>
<rect x="34" y="34" width="652" height="1012" rx="16" fill="none" stroke="#e5dde6" stroke-width="3"/>
<rect x="52" y="52" width="616" height="976" rx="12" fill="none" stroke="#f7f0f2" stroke-width="2"/>

<!-- scattered pastel hearts and gold stars, intentionally light and airy -->
<g>
  <path class="heart" fill="#f7bfd8" d="M122 156 C112 136 140 126 151 146 C164 126 192 138 181 158 C170 180 151 190 151 190 C151 190 132 178 122 156Z"/>
  <path class="heart" fill="#c8f2df" d="M548 142 C538 122 566 112 577 132 C590 112 618 124 607 144 C596 166 577 176 577 176 C577 176 558 164 548 142Z"/>
  <path class="heart" fill="#cdb7f6" d="M566 390 C554 370 584 356 598 378 C612 356 644 370 630 394 C616 420 598 430 598 430 C598 430 578 414 566 390Z"/>
  <path class="heart" fill="#bfe7ff" d="M116 700 C105 680 135 668 148 690 C162 668 192 682 179 704 C166 728 148 738 148 738 C148 738 128 722 116 700Z"/>
  <path class="heart" fill="#f8dfa5" d="M574 770 C562 750 594 736 606 758 C620 736 650 750 636 774 C622 800 606 808 606 808 C606 808 586 794 574 770Z"/>
  <path class="heart" fill="#f7bfd8" d="M250 848 C240 830 266 820 278 838 C290 820 318 832 306 852 C294 874 278 882 278 882 C278 882 260 870 250 848Z"/>

  <path class="star" stroke="#c79b37" d="M104 272 l8 18 19 2 -15 12 5 19 -17-10 -17 10 5-19 -15-12 19-2z"/>
  <path class="star" stroke="#cdb7f6" d="M592 260 l6 14 15 1 -12 10 4 15 -13-8 -13 8 4-15 -12-10 15-1z"/>
  <path class="star" stroke="#bfe7ff" d="M156 510 l6 14 15 1 -12 10 4 15 -13-8 -13 8 4-15 -12-10 15-1z"/>
  <path class="star" stroke="#c79b37" d="M548 592 l8 18 19 2 -15 12 5 19 -17-10 -17 10 5-19 -15-12 19-2z"/>
  <path class="star" stroke="#f7bfd8" d="M452 124 l5 11 12 1 -9 8 3 12 -11-7 -11 7 3-12 -9-8 12-1z"/>
</g>

<!-- loose pastel cloud/moon wash behind character -->
<g class="wash">
  <ellipse cx="360" cy="272" rx="186" ry="86" fill="#f8ddec"/>
  <ellipse cx="288" cy="276" rx="120" ry="64" fill="#cdb7f6"/>
  <ellipse cx="444" cy="274" rx="130" ry="70" fill="#bfe7ff"/>
  <ellipse cx="360" cy="314" rx="210" ry="58" fill="#fffdf8" opacity=".55"/>
</g>
<path class="thin" d="M182 288 C226 230 300 230 342 274 C386 220 482 230 526 288 C558 326 530 358 488 352"/>

<!-- gold horn -->
<g>
  <path d="M342 374 L394 160 L438 386 Z" fill="url(#gold)" opacity=".92"/>
  <path class="ink" d="M342 374 L394 160 L438 386"/>
  <path class="thin" stroke="#fff4bd" d="M365 286 C386 272 405 252 416 226"/>
  <path class="thin" stroke="#8d6427" d="M356 328 C382 314 412 286 426 256"/>
  <path class="thin" stroke="#fff4bd" d="M377 236 C390 226 402 212 410 194"/>
</g>

<!-- ears with watercolor centers -->
<path d="M230 436 C188 334 220 270 282 348 C300 384 286 426 252 456Z" fill="#fffdf8"/>
<path d="M490 438 C536 340 508 276 444 350 C424 388 438 430 470 458Z" fill="#fffdf8"/>
<path class="wash" d="M242 410 C220 354 232 320 268 360 C276 386 268 408 250 428Z" fill="#f7bfd8"/>
<path class="wash" d="M476 412 C500 356 488 322 452 362 C444 388 452 410 470 430Z" fill="#cdb7f6"/>
<path class="ink" d="M230 436 C188 334 220 270 282 348 C300 384 286 426 252 456"/>
<path class="ink" d="M490 438 C536 340 508 276 444 350 C424 388 438 430 470 458"/>

<!-- flower crown -->
<g>
  <circle cx="288" cy="444" r="34" fill="#f7bfd8" opacity=".9" filter="url(#soft)"/>
  <circle cx="414" cy="444" r="30" fill="#f7bfd8" opacity=".84" filter="url(#soft)"/>
  <circle cx="354" cy="430" r="22" fill="#bfe7ff" opacity=".9" filter="url(#soft)"/>
  <path class="ink" stroke="#d96f9d" d="M270 444 C276 418 314 420 318 446 C322 472 286 484 270 464 C252 442 280 424 300 438"/>
  <path class="ink" stroke="#d96f9d" d="M398 444 C402 420 436 420 442 444 C448 468 414 480 398 462 C382 444 408 428 426 438"/>
  <path class="thin" stroke="#559f7b" d="M244 466 C216 458 194 472 176 496 M442 466 C472 452 498 460 520 486 M332 454 C312 468 302 490 296 514 M382 456 C402 472 416 490 426 512"/>
  <path d="M178 496 C208 476 228 468 246 470 C226 500 202 512 178 496Z" fill="#7fcf96" opacity=".72"/>
  <path d="M522 486 C492 468 468 464 444 470 C466 500 494 506 522 486Z" fill="#7fcf96" opacity=".72"/>
</g>

<!-- unicorn face, mostly white with soft grey and blush watercolor -->
<g>
  <path d="M196 466 C220 404 290 372 360 382 C438 394 502 450 514 538 C528 646 448 738 354 746 C260 754 190 676 188 574 C187 532 188 500 196 466Z" fill="#fffdf8"/>
  <path class="wash" d="M226 498 C248 432 320 410 392 426 C456 440 488 500 488 564 C488 654 414 716 326 704 C246 692 210 618 226 498Z" fill="#e7e1e8" opacity=".42"/>
  <path class="wash" d="M416 548 C464 532 496 554 506 590 C472 594 438 590 404 574Z" fill="#f7bfd8" opacity=".45"/>
  <path class="ink" d="M196 466 C220 404 290 372 360 382 C438 394 502 450 514 538 C528 646 448 738 354 746 C260 754 190 676 188 574 C187 532 188 500 196 466Z"/>

  <!-- closed eyes like reference -->
  <path class="lash" d="M260 566 C296 592 330 592 362 562"/>
  <path class="lash" d="M238 558 L220 546 M256 574 L240 590 M282 584 L276 606 M312 584 L318 606 M342 572 L358 588"/>
  <path class="lash" d="M422 562 C448 584 478 584 504 562" opacity=".78"/>
  <path class="lash" d="M408 554 L394 542 M430 574 L420 590 M456 580 L456 600 M482 574 L496 590" opacity=".78"/>

  <path class="thin" d="M496 600 C478 626 446 634 416 620"/>
  <circle cx="438" cy="592" r="10" fill="#f7bfd8" opacity=".38" filter="url(#soft)"/>
</g>

<!-- rainbow mane, painted stripes with sketch lines -->
<g>
  <path class="wash" d="M194 492 C112 584 134 736 272 842 C190 784 180 698 204 620 C222 562 254 520 310 470 C264 462 226 468 194 492Z" fill="#f7bfd8"/>
  <path class="wash" d="M222 520 C152 616 178 718 280 812" stroke="#cdb7f6" stroke-width="32" stroke-linecap="round" fill="none"/>
  <path class="wash" d="M248 522 C188 622 216 704 300 784" stroke="#bfe7ff" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path class="wash" d="M276 512 C228 616 250 690 326 760" stroke="#c8f2df" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path class="wash" d="M304 494 C266 602 282 674 350 736" stroke="#f8dfa5" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path class="ink" d="M196 492 C118 584 136 736 272 842"/>
  <path class="thin" d="M222 520 C152 616 178 718 280 812"/>
  <path class="thin" d="M248 522 C188 622 216 704 300 784"/>
  <path class="thin" d="M276 512 C228 616 250 690 326 760"/>
  <path class="thin" d="M304 494 C266 602 282 674 350 736"/>
</g>

<!-- little moon flowers at base -->
<g opacity=".88">
  <path class="thin" stroke="#559f7b" d="M176 870 C210 840 238 836 272 856 M448 850 C486 826 526 832 552 864"/>
  <path fill="#f7bfd8" d="M256 846 c-18-20 18-20 0 0 c20-18 20 18 0 0 c18 20-18 20 0 0 c-20 18-20-18 0 0"/>
  <path fill="#cdb7f6" d="M492 840 c-16-18 16-18 0 0 c18-16 18 16 0 0 c16 18-16 18 0 0 c-18 16-18-16 0 0"/>
</g>

<!-- handwritten title -->
<g>
  <text x="360" y="946" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#5d4774">The Moonlit Unicorn</text>
  <path class="thin" d="M198 966 C296 982 424 982 522 966" stroke="#f8dfa5" opacity=".8"/>
</g>
</svg>
